<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheksiz Koinotim ❤️</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js, OrbitControls, Tween.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030008;
            color: #ffffff;
        }
        .font-serif-luxury {
            font-family: 'Cinzel', serif;
        }
        .font-cursive {
            font-family: 'Great Vibes', cursive;
        }

        /* Premium Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .glass-btn {
            background: linear-gradient(135deg, rgba(255, 77, 141, 0.25), rgba(157, 78, 221, 0.25));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 182, 217, 0.4);
            box-shadow: 0 10px 25px rgba(255, 77, 141, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-btn:hover {
            background: linear-gradient(135deg, rgba(255, 77, 141, 0.5), rgba(157, 78, 221, 0.5));
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 35px rgba(255, 77, 141, 0.6), 0 0 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-3px) scale(1.03);
        }
        .glass-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Glowing text effects */
        .glow-title {
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.6), 0 0 40px rgba(186, 85, 211, 0.4);
        }

        /* Typewriter Cursor */
        .typewriter-cursor::after {
            content: '|';
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Heartbeat Pulse for UI Elements */
        .pulse-slow {
            animation: pulseSlow 2s infinite ease-in-out;
        }
        @keyframes pulseSlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(255, 77, 141, 0.5)); }
            50% { transform: scale(1.12); filter: drop-shadow(0 0 25px rgba(255, 77, 141, 0.9)); }
        }

        /* Scrollbar styling for modals */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 5, 20, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #ff4d8d, #9d4ede);
            border-radius: 10px;
        }
    </style>
</head>
<body class="relative">

    <!-- WebGL Canvas -->
    <div id="canvas-container" class="absolute inset-0 w-full h-full z-0 cursor-grab active:cursor-grabbing"></div>

    <!-- UI Overlay Header -->
    <header class="absolute top-0 left-0 w-full p-4 sm:p-8 z-10 flex justify-between items-start pointer-events-none">
        <div class="pointer-events-auto flex items-center space-x-4">
            <div class="w-12 h-12 rounded-full glass-card flex items-center justify-center text-pink-400 text-2xl pulse-slow">
                ❤️
            </div>
            <div>
                <h1 id="header-gf-name" class="text-2xl sm:text-3xl font-bold font-serif-luxury text-transparent bg-clip-text bg-gradient-to-r from-pink-300 via-rose-200 to-purple-300 glow-title tracking-wider">
                    Sening uchun...
                </h1>
                <p id="subheading-text" class="text-xs sm:text-sm text-pink-200/80 font-light tracking-widest uppercase mt-0.5">
                    Realistik 3D Koinot
                </p>
            </div>
        </div>

        <!-- Audio Control Toggle -->
        <button id="audio-toggle-btn" class="pointer-events-auto glass-btn text-pink-200 w-12 h-12 rounded-full flex items-center justify-center text-lg focus:outline-none" title="Fon musiqasi">
            <i id="audio-icon" class="fas fa-music"></i>
        </button>
    </header>

    <!-- Floating Live Counter Badge (Middle Top) -->
    <div class="absolute top-24 left-1/2 -translate-x-1/2 z-10 pointer-events-none text-center px-4 w-full max-w-md">
        <div class="glass-card py-2.5 px-6 rounded-full inline-flex items-center justify-center space-x-3 text-xs sm:text-sm text-pink-100 font-light tracking-wide border border-pink-500/20 shadow-2xl">
            <span class="inline-block w-2 h-2 rounded-full bg-pink-500 animate-ping"></span>
            <span id="live-timer-counter" class="font-semibold text-pink-200">Hisoblanmoqda...</span>
        </div>
    </div>

    <!-- Interactive Hint Overlay -->
    <div id="hint-toast" class="absolute bottom-28 left-1/2 -translate-x-1/2 z-10 pointer-events-none text-center transition-opacity duration-1000 opacity-90">
        <p class="text-xs text-pink-200/90 glass-card px-5 py-2 rounded-full border border-pink-400/20 shadow-xl tracking-wide">
            ✨ Sichqonchani harakatlantiring, 3D kartalarni bosing yoki fazoni aylantiring
        </p>
    </div>

    <!-- Bottom Action Controls -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 flex items-center justify-center gap-3 sm:gap-5 w-full px-4 max-w-md pointer-events-auto">
        <button id="open-letter-btn" class="glass-btn flex-1 py-3.5 px-6 rounded-2xl text-white font-medium text-sm sm:text-base flex items-center justify-center space-x-2.5">
            <i class="fas fa-envelope-open-text text-pink-300 text-lg"></i>
            <span>Dil So'zlari</span>
        </button>

        <button id="reset-camera-btn" class="glass-btn py-3.5 px-5 rounded-2xl text-white font-medium text-sm sm:text-base flex items-center justify-center" title="Markazga qaytish">
            <i class="fas fa-compress-arrows-alt text-purple-300 text-lg"></i>
        </button>
    </div>

    <!-- Romantic Letter Modal -->
    <div id="letter-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xl opacity-0 pointer-events-none transition-all duration-500">
        <div class="glass-card w-full max-w-2xl max-h-[85vh] rounded-3xl p-6 sm:p-10 overflow-y-auto relative border border-pink-400/30 text-pink-100 transform scale-95 transition-all duration-500" id="letter-modal-card">
            
            <button id="close-letter-btn" class="absolute top-5 right-5 text-pink-300/70 hover:text-white text-xl w-10 h-10 rounded-full flex items-center justify-center hover:bg-pink-500/20 transition-all">
                ✕
            </button>

            <div class="text-center mb-8">
                <span class="text-4xl inline-block pulse-slow">💖</span>
                <h2 id="modal-title" class="text-3xl sm:text-4xl font-bold font-cursive text-pink-300 mt-1 glow-title">
                    Mening Yagonam...
                </h2>
                <div class="w-24 h-0.5 bg-gradient-to-r from-transparent via-pink-400 to-transparent mx-auto mt-3"></div>
            </div>

            <!-- Typewriter Text Container -->
            <div id="typewriter-text" class="space-y-4 text-sm sm:text-base leading-relaxed font-light text-pink-100/90 font-sans typewriter-cursor min-h-[160px]">
                <!-- Text dynamically typed -->
            </div>

            <!-- Quote & Signature -->
            <div class="mt-10 pt-6 border-t border-pink-500/20 text-center italic text-xs sm:text-sm text-pink-300/80">
                <p id="letter-quote">"Sen mening bugunim va barcha ertanggi kunlarimsan."</p>
                <div class="mt-4 font-cursive text-3xl text-pink-400 glow-title" id="letter-signature">Doimo sen bilan ❤️</div>
            </div>
        </div>
    </div>

    <!-- MAIN 3D APPLICATION SCRIPT -->
    <script>
        /* ========================================================================
           1. CONFIGURATION / SHAXSIY SOZLAMALAR
           ======================================================================== */
        const CONFIG = {
            girlName: "Sevgilim",                 // Qiz do'stingiz ismi
            relationshipStartDate: "2023-01-01T00:00:00", // Tanishgan/Sevgan kuningiz
            
            // Dil so'zlari maktubi
            letterText: [
                "Salom, mening yagonam! Ushbu mo'jizakor 3D koinot faqat va faqat sen uchun maxsus tayyorlandi.",
                "Hayotimga kirib kelganingdan beri har bir kunim o'zgacha nur, iliqlik va quvonch bilan to'ldi. Sening birgina tabassuming menga dunyoiy baxt va cheksiz ilhom beradi.",
                "Ushbu fazodagi aylanayotgan har bir kristal, nur zarralari va porloq xotiralarimiz senga bo'lgan samimiy va abadiy sevgimning ko'zgusidir.",
                "Har bir soniya va har bir kun sen bilan yanada go'zal. Yoningda bo meyorida asrashga va seni doimo baxtli qilishga va'da beraman. Yaxshiyamki borsan!"
            ],
            
            romanticQuote: "“Dunyo cheksiz, lekin mening koinotim faqat sening atrofingda aylanadi...”",
            signature: "Cheksiz sevgi bilan ❤️",

            // 3D Orbitadagi Xotira Kartochkalari (Rasmlar va Tavsiflar)
            memories: [
                {
                    title: "Ilk Uchrashuv",
                    date: "Baxtli Kun",
                    desc: "Sening ko'zlaringdagi nur va birinchi samimiy tabassuming...",
                    img: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=800&q=80"
                },
                {
                    title: "Shirin Lahzalar",
                    date: "Unutilmas",
                    desc: "Birga o'tkazgan har bir daqiqamiz oltindan qadrliroq...",
                    img: "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=800&q=80"
                },
                {
                    title: "Romantic Oqshom",
                    date: "Yulduzlar ostida",
                    desc: "Sen bilan hatto sukunat ham eng go'zal kuyga aylanadi...",
                    img: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=800&q=80"
                },
                {
                    title: "Abadiy Sevgi",
                    date: "Ertanggi Kunimiz",
                    desc: "Kelajakdagi barcha orzularimizga birgalikda erishamiz!",
                    img: "https://images.unsplash.com/photo-1494774157365-9e04c6720e47?auto=format&fit=crop&w=800&q=80"
                }
            ]
        };

        /* ========================================================================
           2. LIVE TIME COUNTER LOGIC
           ======================================================================== */
        function updateLiveCounter() {
            const startDate = new Date(CONFIG.relationshipStartDate).getTime();
            const now = new Date().getTime();
            const diff = now - startDate;

            if (isNaN(diff) || diff < 0) {
                document.getElementById('live-timer-counter').innerText = "Birga baxtli lahzalar ✨";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('live-timer-counter').innerText = 
                `${days} kun, ${hours} soat, ${minutes} daqiqa, ${seconds} soniya birgamiz ❤️`;
        }
        setInterval(updateLiveCounter, 1000);
        updateLiveCounter();

        // UI Header Text
        document.getElementById('header-gf-name').innerText = `${CONFIG.girlName} uchun ❤️`;
        document.getElementById('letter-quote').innerText = CONFIG.romanticQuote;
        document.getElementById('letter-signature').innerText = CONFIG.signature;

        /* ========================================================================
           3. PROCEDURAL AMBIENT SYNTH & AUDIO (Web Audio API)
           ======================================================================== */
        let audioCtx = null;
        let isAudioPlaying = false;
        let audioTimer = null;

        function initAudioEngine() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playRomanticChordSequence() {
            if (!audioCtx || audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Soft Dreamy Chords (Fmaj7, Cmaj7, Am7, G)
            const chords = [
                [174.61, 220.00, 261.63, 329.63], // Fmaj7
                [130.81, 164.81, 196.00, 246.94], // Cmaj7
                [220.00, 261.63, 329.63, 392.00], // Am7
                [196.00, 246.94, 293.66, 392.00]  // G
            ];

            let chordIndex = 0;

            audioTimer = setInterval(() => {
                if (!isAudioPlaying) return;

                const currentChord = chords[chordIndex % chords.length];
                currentChord.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq * (idx % 2 === 0 ? 1 : 2), audioCtx.currentTime);

                    // Soft Attack & Decay Envelope
                    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 1.2);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.5);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(audioCtx.currentTime + idx * 0.15);
                    osc.stop(audioCtx.currentTime + 4.8);
                });

                chordIndex++;
            }, 3500);
        }

        const audioToggleBtn = document.getElementById('audio-toggle-btn');
        const audioIcon = document.getElementById('audio-icon');

        audioToggleBtn.addEventListener('click', () => {
            initAudioEngine();
            isAudioPlaying = !isAudioPlaying;

            if (isAudioPlaying) {
                audioToggleBtn.classList.add('border-pink-300', 'bg-pink-500/40');
                audioIcon.className = 'fas fa-volume-up text-pink-200';
                playRomanticChordSequence();
            } else {
                audioToggleBtn.classList.remove('border-pink-300', 'bg-pink-500/40');
                audioIcon.className = 'fas fa-music text-pink-200';
                if (audioTimer) clearInterval(audioTimer);
            }
        });

        /* ========================================================================
           4. THREE.JS HYPER-REALISTIC SCENE SETUP
           ======================================================================== */
        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030008, 0.012);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 32);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.6;
        controls.maxDistance = 50;
        controls.minDistance = 10;
        controls.enablePan = false;

        /* Lighting */
        const ambientLight = new THREE.AmbientLight(0xffb6c1, 0.6);
        scene.add(ambientLight);

        const centerPointLight = new THREE.PointLight(0xff1493, 3, 40);
        centerPointLight.position.set(0, 0, 0);
        scene.add(centerPointLight);

        const topLight = new THREE.DirectionalLight(0xffffff, 1.2);
        topLight.position.set(10, 20, 15);
        scene.add(topLight);

        const rimLight = new THREE.DirectionalLight(0x9d4ede, 1.5);
        rimLight.position.set(-10, -10, -10);
        scene.add(rimLight);

        /* Environment Map Simulation (Dynamic Cubemap Reflection) */
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        /* ========================================================================
           5. VOLUMETRIC STARFIELD & LIGHT DUST PARTICLES
           ======================================================================== */
        const starCount = 3000;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);

        const col1 = new THREE.Color(0xff4d8d);
        const col2 = new THREE.Color(0x9d4ede);
        const col3 = new THREE.Color(0xffffff);

        for (let i = 0; i < starCount; i++) {
            starPos[i * 3] = (Math.random() - 0.5) * 180;
            starPos[i * 3 + 1] = (Math.random() - 0.5) * 180;
            starPos[i * 3 + 2] = (Math.random() - 0.5) * 180;

            const rColor = Math.random();
            let c = col3;
            if (rColor > 0.6) c = col1;
            else if (rColor > 0.3) c = col2;

            starColors[i * 3] = c.r;
            starColors[i * 3 + 1] = c.g;
            starColors[i * 3 + 2] = c.b;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

        function createSparkleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.4, 'rgba(255, 105, 180, 0.7)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }

        const sparkleTex = createSparkleTexture();

        const starMat = new THREE.PointsMaterial({
            size: 0.7,
            vertexColors: true,
            map: sparkleTex,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        /* ========================================================================
           6. CENTRAL HYPER-REALISTIC CRYSTAL 3D HEART
           ======================================================================== */
        const heartShape = new THREE.Shape();
        const x = 0, y = 0;
        heartShape.moveTo(x + 25, y + 25);
        heartShape.bezierCurveTo(x + 25, y + 25, x + 20, y, x, y);
        heartShape.bezierCurveTo(x - 30, y, x - 30, y + 35, x - 30, y + 35);
        heartShape.bezierCurveTo(x - 30, y + 55, x - 10, y + 77, x + 25, y + 95);
        heartShape.bezierCurveTo(x + 60, y + 77, x + 80, y + 55, x + 80, y + 35);
        heartShape.bezierCurveTo(x + 80, y + 35, x + 80, y, x + 50, y);
        heartShape.bezierCurveTo(x + 35, y, x + 25, y + 25, x + 25, y + 25);

        const extrudeSettings = {
            depth: 16,
            bevelEnabled: true,
            bevelSegments: 8,
            steps: 4,
            bevelSize: 6,
            bevelThickness: 6
        };

        const crystalHeartGeo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
        crystalHeartGeo.center();

        // Realistic Glossy Physical Material
        const crystalHeartMat = new THREE.MeshPhysicalMaterial({
            color: 0xff1493,
            emissive: 0x4a0033,
            roughness: 0.1,
            metalness: 0.1,
            transmission: 0.6, // Glass transparency
            thickness: 1.5,
            ior: 1.5,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1,
            reflectivity: 0.9
        });

        const crystalHeartMesh = new THREE.Mesh(crystalHeartGeo, crystalHeartMat);
        crystalHeartMesh.scale.set(0.07, 0.07, 0.07);
        crystalHeartMesh.rotation.x = Math.PI; // Flip right side up
        scene.add(crystalHeartMesh);

        /* Swirling Ring of Particles around Heart */
        const ringParticleCount = 800;
        const ringGeo = new THREE.BufferGeometry();
        const ringPos = new Float32Array(ringParticleCount * 3);

        for (let i = 0; i < ringParticleCount; i++) {
            const angle = (i / ringParticleCount) * Math.PI * 2;
            const radius = 7 + Math.random() * 1.5;
            ringPos[i * 3] = Math.cos(angle) * radius;
            ringPos[i * 3 + 1] = (Math.random() - 0.5) * 1.5;
            ringPos[i * 3 + 2] = Math.sin(angle) * radius;
        }

        ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
        const ringMat = new THREE.PointsMaterial({
            size: 0.4,
            color: 0xffb6c1,
            map: sparkleTex,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleRing = new THREE.Points(ringGeo, ringMat);
        scene.add(particleRing);

        /* ========================================================================
           7. 3D GLASS ORBITING LOVE CARDS WITH CANVAS TEXTURES
           ======================================================================== */
        const cardsGroup = new THREE.Group();
        scene.add(cardsGroup);

        const cardMeshes = [];
        const textureLoader = new THREE.TextureLoader();

        function createCardTexture(title, date, desc, imgUrl) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 640;
            const ctx = canvas.getContext('2d');

            // Dark Glass Gradient Background
            const bgGrad = ctx.createLinearGradient(0, 0, 512, 640);
            bgGrad.addColorStop(0, 'rgba(35, 10, 45, 0.95)');
            bgGrad.addColorStop(1, 'rgba(10, 3, 20, 0.95)');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 512, 640);

            // Border Glow
            ctx.strokeStyle = 'rgba(255, 182, 217, 0.5)';
            ctx.lineWidth = 12;
            ctx.strokeRect(6, 6, 500, 628);

            // Inner Frame
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 2;
            ctx.strokeRect(24, 24, 464, 592);

            // Text Rendering
            ctx.fillStyle = '#ffb6c1';
            ctx.font = 'bold 34px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(title, 256, 470);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = 'italic 22px sans-serif';
            ctx.fillText(date, 256, 510);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.font = '20px sans-serif';
            
            // Multiline description wrapper
            const words = desc.split(' ');
            let line = '';
            let yPos = 555;
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                if (metrics.width > 420 && n > 0) {
                    ctx.fillText(line, 256, yPos);
                    line = words[n] + ' ';
                    yPos += 28;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, 256, yPos);

            const canvasTex = new THREE.CanvasTexture(canvas);

            // Load user photo onto the top half of the canvas card
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                ctx.save();
                // Clip image to rounded rectangle on card
                ctx.beginPath();
                ctx.roundRect(40, 40, 432, 380, 16);
                ctx.clip();
                ctx.drawImage(img, 40, 40, 432, 380);
                ctx.restore();
                canvasTex.needsUpdate = true;
            };
            img.src = imgUrl;

            return canvasTex;
        }

        const cardGeo = new THREE.BoxGeometry(4.5, 5.6, 0.15);

        CONFIG.memories.forEach((item, idx) => {
            const angle = (idx / CONFIG.memories.length) * Math.PI * 2;
            const radius = 16;

            const cardTex = createCardTexture(item.title, item.date, item.desc, item.img);
            
            const cardMat = new THREE.MeshStandardMaterial({
                map: cardTex,
                roughness: 0.2,
                metalness: 0.1,
                emissive: 0xff1493,
                emissiveIntensity: 0.05
            });

            const mesh = new THREE.Mesh(cardGeo, cardMat);
            mesh.position.x = Math.cos(angle) * radius;
            mesh.position.z = Math.sin(angle) * radius;
            mesh.position.y = Math.sin(idx * 1.5) * 2;

            // Orient card facing center heart
            mesh.lookAt(0, mesh.position.y, 0);

            mesh.userData = {
                angle: angle,
                radius: radius,
                initialY: mesh.position.y,
                itemData: item
            };

            cardsGroup.add(mesh);
            cardMeshes.push(mesh);
        });

        /* ========================================================================
           8. DYNAMIC MOUSE SPARKLE TRAIL & CLICK EXPLOSIONS
           ======================================================================== */
        const mouseTrailParticles = [];
        const trailCount = 40;
        const trailGeo = new THREE.BufferGeometry();
        const trailPos = new Float32Array(trailCount * 3);

        trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
        const trailMat = new THREE.PointsMaterial({
            size: 0.6,
            color: 0xff69b4,
            map: sparkleTex,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const trailSystem = new THREE.Points(trailGeo, trailMat);
        scene.add(trailSystem);

        for (let i = 0; i < trailCount; i++) {
            mouseTrailParticles.push({
                x: 0, y: 0, z: 0,
                vx: (Math.random() - 0.5) * 0.1,
                vy: (Math.random() - 0.5) * 0.1,
                vz: (Math.random() - 0.5) * 0.1,
                life: 0
            });
        }

        const mouseVector = new THREE.Vector3();
        let mouseIndex = 0;

        window.addEventListener('pointermove', (e) => {
            const x = (e.clientX / window.innerWidth) * 2 - 1;
            const y = -(e.clientY / window.innerHeight) * 2 + 1;

            mouseVector.set(x, y, 0.5).unproject(camera);
            const dir = mouseVector.sub(camera.position).normalize();
            const pos = camera.position.clone().add(dir.multiplyScalar(15));

            mouseTrailParticles[mouseIndex].x = pos.x;
            mouseTrailParticles[mouseIndex].y = pos.y;
            mouseTrailParticles[mouseIndex].z = pos.z;
            mouseTrailParticles[mouseIndex].life = 1.0;

            mouseIndex = (mouseIndex + 1) % trailCount;
        });

        /* 3D Floating Heart Burst on Click */
        const clickExplosions = [];

        function spawnHeartBurst(point) {
            const count = 20;
            const geom = new THREE.BufferGeometry();
            const pos = [];
            const vels = [];

            for (let i = 0; i < count; i++) {
                pos.push(point.x, point.y, point.z);
                vels.push(
                    (Math.random() - 0.5) * 0.4,
                    (Math.random() - 0.5) * 0.4,
                    (Math.random() - 0.5) * 0.4
                );
            }

            geom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.8,
                color: 0xff1493,
                map: sparkleTex,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const pSystem = new THREE.Points(geom, mat);
            scene.add(pSystem);

            clickExplosions.push({
                system: pSystem,
                vels: vels,
                life: 1.0
            });
        }

        /* ========================================================================
           9. RAYCASTING & SMOOTH CAMERA FOCUS (TWEEN)
           ======================================================================== */
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let isFocusing = false;

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#letter-modal') || e.target.closest('button')) return;

            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(cardMeshes);

            if (intersects.length > 0) {
                // Focus on clicked card smoothly
                const clickedCard = intersects[0].object;
                focusOnObject(clickedCard);
            } else {
                // Spawn 3D Heart burst in space
                const vector = new THREE.Vector3(pointer.x, pointer.y, 0.5).unproject(camera);
                const dir = vector.sub(camera.position).normalize();
                const pos = camera.position.clone().add(dir.multiplyScalar(18));
                spawnHeartBurst(pos);
            }
        });

        function focusOnObject(targetMesh) {
            isFocusing = true;
            const targetPos = targetMesh.position.clone();
            const offset = targetMesh.getWorldDirection(new THREE.Vector3()).multiplyScalar(8);
            const camTargetPos = targetPos.clone().add(offset);

            new TWEEN.Tween(camera.position)
                .to({ x: camTargetPos.x, y: camTargetPos.y + 1, z: camTargetPos.z }, 1500)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            new TWEEN.Tween(controls.target)
                .to({ x: targetPos.x, y: targetPos.y, z: targetPos.z }, 1500)
                .easing(TWEEN.Easing.Cubic.Out)
                .onComplete(() => {
                    isFocusing = false;
                })
                .start();
        }

        document.getElementById('reset-camera-btn').addEventListener('click', () => {
            new TWEEN.Tween(camera.position)
                .to({ x: 0, y: 0, z: 32 }, 1500)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            new TWEEN.Tween(controls.target)
                .to({ x: 0, y: 0, z: 0 }, 1500)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();
        });

        /* ========================================================================
           10. TYPEWRITER LETTER MODAL LOGIC
           ======================================================================== */
        const letterModal = document.getElementById('letter-modal');
        const letterModalCard = document.getElementById('letter-modal-card');
        const openLetterBtn = document.getElementById('open-letter-btn');
        const closeLetterBtn = document.getElementById('close-letter-btn');
        const typewriterContainer = document.getElementById('typewriter-text');

        let typewriterTimeout = null;

        function openModal() {
            letterModal.classList.remove('opacity-0', 'pointer-events-none');
            letterModalCard.classList.remove('scale-95');
            letterModalCard.classList.add('scale-100');
            startTypewriter();
        }

        function closeModal() {
            letterModal.classList.add('opacity-0', 'pointer-events-none');
            letterModalCard.classList.remove('scale-100');
            letterModalCard.classList.add('scale-95');
            if (typewriterTimeout) clearTimeout(typewriterTimeout);
        }

        function startTypewriter() {
            typewriterContainer.innerHTML = '';
            const fullText = CONFIG.letterText.join('\n\n');
            let i = 0;

            function typeChar() {
                if (i < fullText.length) {
                    const char = fullText.charAt(i);
                    if (char === '\n') {
                        typewriterContainer.innerHTML += '<br><br>';
                    } else {
                        typewriterContainer.innerHTML += char;
                    }
                    i++;
                    typewriterTimeout = setTimeout(typeChar, 30);
                } else {
                    typewriterContainer.classList.remove('typewriter-cursor');
                }
            }
            typewriterContainer.classList.add('typewriter-cursor');
            typeChar();
        }

        openLetterBtn.addEventListener('click', openModal);
        closeLetterBtn.addEventListener('click', closeModal);
        letterModal.addEventListener('click', (e) => {
            if (e.target === letterModal) closeModal();
        });

        // Toast auto-hide
        setTimeout(() => {
            const toast = document.getElementById('hint-toast');
            if (toast) toast.classList.add('opacity-0');
        }, 8000);

        /* ========================================================================
           11. ANIMATION LOOP & RESIZE
           ======================================================================== */
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            TWEEN.update();
            const elapsedTime = clock.getElapsedTime();

            // 1. Central Crystal Heart Pulse & Soft Spin
            const pulse = 0.07 + Math.sin(elapsedTime * 3.5) * 0.005;
            crystalHeartMesh.scale.set(pulse, pulse, pulse);
            crystalHeartMesh.rotation.y = elapsedTime * 0.4;

            // 2. Rotate Particle Ring
            particleRing.rotation.y = -elapsedTime * 0.6;
            particleRing.rotation.x = Math.sin(elapsedTime * 0.5) * 0.2;

            // 3. Starfield subtle drift
            starField.rotation.y = elapsedTime * 0.02;

            // 4. Orbit 3D Cards unless user focused
            if (!isFocusing) {
                cardMeshes.forEach((mesh, idx) => {
                    const currentAngle = mesh.userData.angle + elapsedTime * 0.12;
                    mesh.position.x = Math.cos(currentAngle) * mesh.userData.radius;
                    mesh.position.z = Math.sin(currentAngle) * mesh.userData.radius;
                    mesh.position.y = mesh.userData.initialY + Math.sin(elapsedTime * 1.5 + idx) * 0.6;
                    mesh.lookAt(0, mesh.position.y, 0);
                });
            }

            // 5. Update Mouse Sparkle Trail
            const trailPositions = trailSystem.geometry.attributes.position.array;
            mouseTrailParticles.forEach((p, i) => {
                if (p.life > 0) {
                    p.x += p.vx;
                    p.y += p.vy - 0.02; // Downward gravity spark
                    p.z += p.vz;
                    p.life -= 0.025;
                }
                trailPositions[i * 3] = p.x;
                trailPositions[i * 3 + 1] = p.y;
                trailPositions[i * 3 + 2] = p.z;
            });
            trailSystem.geometry.attributes.position.needsUpdate = true;

            // 6. Update Click Explosions
            for (let i = clickExplosions.length - 1; i >= 0; i--) {
                const exp = clickExplosions[i];
                const pos = exp.system.geometry.attributes.position.array;

                for (let j = 0; j < pos.length / 3; j++) {
                    pos[j * 3] += exp.vels[j * 3];
                    pos[j * 3 + 1] += exp.vels[j * 3 + 1];
                    pos[j * 3 + 2] += exp.vels[j * 3 + 2];
                }

                exp.system.geometry.attributes.position.needsUpdate = true;
                exp.life -= 0.025;
                exp.system.material.opacity = exp.life;

                if (exp.life <= 0) {
                    scene.remove(exp.system);
                    exp.system.geometry.dispose();
                    exp.system.material.dispose();
                    clickExplosions.splice(i, 1);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = () => {
            animate();
        };
    </script>
</body>
</html>
